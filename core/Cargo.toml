[package]
name = "void-notes-core"
version = "0.1.0"
edition = "2021"
authors = ["Bruno Souza <brunosouzar@users.noreply.github.com>"]
description = "Core native engine for void-notes"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
anyhow = "1.0"
